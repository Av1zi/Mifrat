# Scrapy Cloud deploy config. Fill in `project` with the numeric project ID
# from your Scrapy Cloud dashboard (same value that goes in scrapy.cfg's
# [deploy] section) before running `shub deploy`.
#
# project: <numeric-project-id>

requirements:
  file: requirements.txt

# Pinned explicitly (rather than relying on account default) so a future
# account-level default-stack change doesn't silently switch what gets
# deployed. If the setuptools build error from Aug 2026 (see README/plan
# decision log) turns out to be specific to this stack tag, try dropping
# back a minor version here as a workaround while it's investigated with
# Zyte support.
stack: scrapy:2.17
