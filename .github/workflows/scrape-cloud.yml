name: scrape-cloud
# Cloud-safe vendors only (§2/§6/§8 of pc-parts-il-plan.md). TMS is NOT
# here — it blocks datacenter IPs and runs on the Jetson Nano instead
# (nano/README.md). Spiders themselves are location-agnostic; this file is
# the only place that decides which vendors run in the cloud.
#
# Ivory added to the matrix (Aug 2026) — spider is built and owner-confirmed
# (see DECISIONS.md). KSP stays absent: Phase 5 stretch goal, gated on the
# API application, see scraper/spiders/ksp.py.
#
# `permissions: contents: write` (Aug 2026 fix, see DECISIONS.md): the
# default GITHUB_TOKEN is read-only on repos where the repo-level
# "Workflow permissions" setting defaults to read-only — commits succeed
# locally, then push 403s. Same fix as normalize-and-deploy.yml.
on:
  schedule:
    - cron: '59 20 * * *'  # Randomized gate opens at 23:59 Israel time (UTC+3)
    - cron: '0 7 * * *'    # 10:00 Israel-time fallback check (UTC+3)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  schedule-gate:
    runs-on: ubuntu-latest
    outputs:
      fallback: ${{ steps.mode.outputs.fallback }}
    steps:
      - id: mode
        shell: bash
        env:
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ "$SCHEDULE" = "0 7 * * *" ]; then
            echo "fallback=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "fallback=false" >> "$GITHUB_OUTPUT"
          # Spread load across the overnight window. This is for reliability
          # and load distribution, not for bypassing site defenses.
          # Leave headroom for the matrix/detail jobs before the 6-hour
          # Actions job limit.
          sleep "$((RANDOM % 18000))"

  scrape:
    needs: schedule-gate
    runs-on: ubuntu-latest
    strategy:
      # One vendor failing must not kill the others' scrapes (§10).
      fail-fast: false
      matrix:
        spider: [onepc, plonter, ivory]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt --break-system-packages
      # Plonter's WAF bypass needs the actual Chromium binary — pip
      # installing the scrapy-playwright package alone does NOT provide it.
      # This was missing entirely before (Aug 2026 fix, see DECISIONS.md);
      # only onepc/ivory don't need it, but installing unconditionally is
      # simpler and harmless than a per-matrix-entry conditional.
      - run: python -m playwright install --with-deps chromium
      - name: Scrape vendor unless today's fallback artifact exists
        env:
          FALLBACK: ${{ needs.schedule-gate.outputs.fallback }}
        run: |
          output="data/raw/$(date -u +%F)/${{ matrix.spider }}.jsonl"
          if [ "$FALLBACK" = "true" ] && [ -s "$output" ]; then
            echo "${{ matrix.spider }} already has a current snapshot; skipping fallback"
            exit 0
          fi
          python scraper/run_spider.py "${{ matrix.spider }}"
      # Commit ONLY this job's own snapshot file. Never `data/raw/` — the
      # matrix jobs run in parallel on stale checkouts, and `git add` on a
      # shared directory stages the siblings' files as DELETED (Sep 2026
      # wiped 5 days of plonter/ivory snapshots exactly this way).
      - run: |
          git config user.email "bot@users.noreply.github.com"
          git config user.name "pc-parts-il-bot"
          bash scripts/git_commit_push.sh \
            "scrape(${{ matrix.spider }}): $(date -u +%F)" \
            "data/raw/$(date -u +%F)/${{ matrix.spider }}.jsonl"

  # Detail-page scrape: runs after all listing spiders succeed.
  # Fetches each vendor's product detail pages for structured specs
  # and cover images. Steady state is a handful of new items/day; the
  # first runs after a ledger fix backfill in --limit chunks. Images are
  # downloaded as resized JPEG and committed to the repo (plan §7 —
  # trivial repo growth at this rate).
  detail-scrape:
    needs: [schedule-gate, scrape]
    # A single vendor failing (e.g. Ivory 403-blocking datacenter IPs, Sep
    # 2026) must not cancel everyone else's detail scrape: without this,
    # `needs` requires ALL matrix legs to succeed, so one vendor's block
    # silently kills onepc/plonter detail + the whole detail commit.
    # The failed vendor is covered by normalize's 14-day stale-forward.
    if: "!cancelled()"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt --break-system-packages
      - run: python -m playwright install --with-deps chromium
      # Build pending lists: diff listing output vs the detail_scraped ledger
      # (TMS excluded — it's not cloud-run; the Nano handles it).
      # --limit caps the post-ledger-fix backfill so the first runs don't
      # hammer Plonter with thousands of Playwright page loads at once.
      - run: python -m scraper.make_detail_pending make ivory onepc plonter --limit 200
      # Run detail spiders, skipping vendors with nothing pending. `-o`
      # APPENDS — never `-O` overwrite: the committed detail file holds
      # the full history, and a small nightly chunk must not wipe it
      # (an -O + tiny-pending run would destroy thousands of rows).
      - run: |
          for v in ivory onepc plonter; do
            n=$(python -c "import json;print(len(json.load(open('data/detail_pending/$v.json'))))")
            if [ "$n" -gt 0 ]; then
              echo "$v: $n pending — scraping"
              scrapy crawl "${v}_detail" -o "data/raw/detail/$v.jsonl:jsonlines"
            else
              echo "$v: nothing pending — keeping existing detail file"
            fi
          done
      # Download and resize cover images (files already on disk are
      # skipped, missing ones retried, imageless products skipped quietly)
      - run: python -m scraper.download_images data/raw/detail/ivory.jsonl ivory
      - run: python -m scraper.download_images data/raw/detail/onepc.jsonl onepc
      - run: python -m scraper.download_images data/raw/detail/plonter.jsonl plonter
      # Mark spec-scraped items in the ledger. Image presence does NOT
      # gate marking (see make_detail_pending): imageless products would
      # otherwise re-scrape every day forever.
      - run: python -m scraper.make_detail_pending mark ivory onepc plonter
      # NOTE: per-vendor paths only (see the scrape job above for why shared
      # directories are forbidden here). data/images/<vendor>/ holds only
      # that vendor's downloaded covers, so those three dirs are safe.
      # Commit only paths that EXIST: a vendor with zero new rows has no
      # ledger file, and that must not fail the other vendors' commit
      # (Sep 2026: static path list + missing onepc ledger = exit 128,
      # losing the whole run's detail commit).
      - run: |
          git config user.email "bot@users.noreply.github.com"
          git config user.name "pc-parts-il-bot"
          PATHS=(
            data/detail_pending/ivory.json data/detail_pending/onepc.json data/detail_pending/plonter.json
            data/raw/detail/ivory.jsonl data/raw/detail/onepc.jsonl data/raw/detail/plonter.jsonl
            data/detail_scraped/ivory.json data/detail_scraped/onepc.json data/detail_scraped/plonter.json
            data/images/ivory/ data/images/onepc/ data/images/plonter/
          )
          EXISTING=()
          for p in "${PATHS[@]}"; do
            if [ -e "$p" ]; then EXISTING+=("$p"); fi
          done
          if [ "${#EXISTING[@]}" -eq 0 ]; then echo "nothing to commit"; exit 0; fi
          bash scripts/git_commit_push.sh \
            "detail-scrape: $(date -u +%F)" \
            "${EXISTING[@]}"