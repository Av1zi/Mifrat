name: normalize-and-deploy
# Reads whatever's in data/raw/ (today's snapshots plus the stale-forward
# fallback in scraper/normalize_and_match.py for any vendor missing today)
# and writes data/catalog.json. No separate deploy step — Cloudflare Pages
# rebuilds automatically on the push this job makes.
#
# Trigger (Aug 2026 rework, see DECISIONS.md): previously a fixed
# `cron: 0 9 * * *`, picked as "probably after both scrapers." In practice
# the Nano and scrape-cloud finish at very different, sometimes
# unpredictable times (manual runs, cron drift, TMS's own throttling), so
# a fixed clock time left hours of dead air between the last scrape
# landing and the catalog actually rebuilding. Switched to reacting
# directly to new raw snapshots being pushed instead — from EITHER source,
# since both the cloud bot and the Nano's deploy key push straight to
# data/raw/ on main.
#
# This revisits the plan's original "no push-triggered workflows, avoids
# recursion questions" stance (pc-parts-il-plan.md §8) — that concern
# doesn't apply here because the path filter is scoped to data/raw/**,
# which this job's own commit (catalog.json + review_queue.json, both
# directly under data/, never data/raw/) can never match. No self-trigger
# is possible.
#
# scrape-cloud's 3 matrix jobs each push separately, which would otherwise
# mean 3 near-simultaneous triggers; the concurrency block below collapses
# that down to "run the one that's active, then run one more against
# whatever's latest" rather than 3 redundant back-to-back rebuilds.
#
# `permissions: contents: write` (Aug 2026 fix, see DECISIONS.md): without
# this, the default GITHUB_TOKEN is read-only on repos where the
# repo-level "Workflow permissions" setting defaults to read-only — git
# commit succeeds locally, then git push 403s. Requesting write access
# explicitly here works regardless of that dashboard setting.
on:
  push:
    branches: [main]
    paths:
      - 'data/raw/**'
  schedule:
    # Safety net only, in case a push trigger is ever missed — deliberately
    # later than the old 09:00 UTC guess, since the push trigger is now the
    # normal path and this should rarely if ever fire in practice.
    - cron: '0 11 * * *'
  workflow_dispatch: {}

concurrency:
  group: normalize-and-deploy
  # Let an in-flight run finish rather than killing half-done work; if
  # several pushes queue up behind it, GitHub keeps only the most recently
  # queued one and drops the rest, so we still end up running once more
  # against the latest data/raw/ state rather than once per push.
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt --break-system-packages
      - run: python scraper/normalize_and_match.py
      - run: |
          git config user.email "bot@users.noreply.github.com"
          git config user.name "pc-parts-il-bot"
          # Both files normalize_and_match.py writes each run — leaving
          # review_queue.json off this list (Aug 2026 bug, see DECISIONS.md)
          # meant it sat modified-but-uncommitted in the working tree,
          # which aborts git_commit_push.sh's rebase-retry path the moment
          # any push needs a retry (exactly what happened with the 403).
          bash scripts/git_commit_push.sh \
            "normalize: catalog for $(date -u +%F)" \
            data/catalog.json data/review_queue.json