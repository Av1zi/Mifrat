name: normalize-and-deploy
# Reads whatever's in data/raw/ (today's snapshots plus the stale-forward
# fallback in scraper/normalize_and_match.py for any vendor missing today)
# and writes data/catalog.json. No separate deploy step — Cloudflare Pages
# rebuilds automatically on the push this job makes.
#
# Trigger (Aug 2026 rework, see DECISIONS.md): previously a fixed
# `cron: 0 9 * * *`, then switched to `on: push: paths: data/raw/**` to
# react directly to new snapshots. That worked for the Nano (SSH deploy
# key push) but NOT for scrape-cloud.yml — GitHub Actions never fires
# on:push for commits pushed using the default GITHUB_TOKEN (built-in
# loop-prevention), so the cloud vendors' pushes were silently invisible
# to this trigger and normalize only ever ran for them via the 11:00 UTC
# fallback cron — an up-to-~8-hour dead gap. Fixed by adding a
# `workflow_run` trigger on scrape-cloud's completion — workflow_run fires
# regardless of which token pushed, so no PAT/secret is needed (keeps
# §9's zero-secrets rule intact for scrape-cloud.yml). It also naturally
# collapses scrape-cloud's 3 matrix-job pushes into one trigger
# (workflow_run fires once when the whole run finishes), which the
# concurrency block below was only approximating before.
#
# This revisits the plan's original "no push-triggered workflows, avoids
# recursion questions" stance (pc-parts-il-plan.md §8) — that concern
# doesn't apply here because the path filter is scoped to data/raw/**,
# which this job's own commit (catalog.json + review_queue.json, both
# directly under data/, never data/raw/) can never match. No self-trigger
# is possible.
#
# `permissions: contents: write` (Aug 2026 fix, see DECISIONS.md): without
# this, the default GITHUB_TOKEN is read-only on repos where the
# repo-level "Workflow permissions" setting defaults to read-only — git
# commit succeeds locally, then git push 403s. Requesting write access
# explicitly here works regardless of that dashboard setting.
on:
  push:
    branches: [main]
    paths:
      - 'data/raw/**'
  workflow_run:
    # Fires when scrape-cloud.yml finishes, success or failure — one
    # vendor failing shouldn't block normalizing the others' fresh data
    # (or stale-forwarding the failed one). Only skip on 'cancelled'.
    workflows: ["scrape-cloud"]
    types: [completed]
  schedule:
    # Safety net only, in case both triggers above are ever missed.
    - cron: '0 11 * * *'
  workflow_dispatch: {}

concurrency:
  group: normalize-and-deploy
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion != 'cancelled'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt --break-system-packages
      - name: Spec schema <-> frontend drift check
        # scraper/specs/schema.py is the single source of truth for spec
        # field names/types/units. Fails when the generated TS
        # (site/src/specSchema.generated.ts) is stale or a hand-written
        # frontend spec key no longer exists in the schema.
        run: python scripts/check_spec_sync.py
      - name: Refresh pcpartdb reference-spec index (spec system Tier 0)
        # Optional reference data, not core data — data/pcpartdb/ is
        # gitignored and rebuilt fresh here every run (~7MB from GitHub's
        # raw CDN, a few seconds) rather than committed. specs/resolvers/
        # reference.py degrades gracefully if this index is missing (Tier 0
        # disabled + a loud warning + the coverage report shows it), so a
        # transient failure here (e.g. GitHub's raw CDN having a bad moment)
        # must not block the daily catalog update — hence continue-on-error.
        run: python -m scraper.pcpartdb refresh
        continue-on-error: true
      - run: python scraper/normalize_and_match.py
      - name: Spec golden fixtures (see scraper/specs/README.md)
        # Hand-verified specs for known products must match the catalog the
        # run just wrote. Tier-0 assertions are skipped automatically when
        # the optional reference index above failed to refresh.
        run: python -m scraper.specs.golden.check_golden
      - name: Vendor detail-page regressions (offline fixtures)
        # Scraped vendor markup + the label vocabulary it feeds. No network:
        # the fixtures live in scraper/specs/golden/tms_pages/. This is the
        # gate that would have caught the TMS selector that matched nothing
        # and silently shipped 2,254 products with an empty spec sheet.
        run: python scripts/check_tms_detail.py
      - name: Spec merge-layer regressions (offline, Sep 2026)
        # Pins the merge RULES the golden fixtures cannot: tier order, the
        # "model is a name, not a part number" rule (Ivory's דגם row shipped an
        # MPN as the model and flipped a product's identity key), validation
        # drops, and the value-equality helpers.
        run: python scripts/check_spec_merge.py
      - name: Photo pipeline regressions (offline, Sep 2026)
        # Candidate derivation, scoring/picking, the refetch rule, the
        # transparent-render pass and site-side resolution — all offline, no
        # network, no real corpus. This is the gate that would have caught the
        # 228px-tile covers (a download that skipped every existing file) and
        # the v1 scoring bug where 1PC's native URL shape read as a downgrade.
        run: python scripts/check_image_pick.py
      - name: Site payload size guard (Phase 8, see DECISIONS.md)
        # Anti-regression lock for the data-trust + performance phases:
        # fail the job (no commit, no deploy) when a category/index file
        # exceeds 1MB or the category payload grows >15% without
        # proportional product growth. Pure stdlib, no deps.
        run: python scraper/check_site_size.py
      # Transparent renders for TMS (Sep 2026, see scraper/process_images.py).
      # TMS is scraped by the Nano, which must not carry an onnxruntime
      # dependency (ARM64, and the snapshot matters far more than photos), so
      # its covers are matted here in the cloud instead. Both steps are
      # best-effort: photos never block the data deploy.
      - run: pip install -r requirements-images.txt --break-system-packages
        continue-on-error: true
      - uses: actions/cache@v5
        with:
          path: ~/.u2net
          key: rembg-isnet-general-use-v1
      # 400/run at ~5-10s/image is ~25-45 min of CPU, well under the 6h
      # job limit; halves the backfill drain vs the original 200.
      - run: python -m scraper.process_images --vendor tms --limit 400 --list-out tmp/renders.txt
        continue-on-error: true
      - name: Drop chewed mattes before commit (Sep 2026, see scraper/detect_chewed.py)
        # isnet occasionally eats product interior (silver IHS, white boards)
        # instead of just the background. The detector drops those paths from
        # the narrow-path list so a chewed render never enters the repo; the
        # .jpg stays served. Best-effort like the matting itself.
        run: python -m scraper.detect_chewed --filter-list tmp/renders.txt
        continue-on-error: true
      - name: Commit transparent TMS renders (narrow paths only)
        # NEVER `git add data/images/tms/` from here: this job does not own that
        # tree (the Nano writes it), and a stale checkout would stage the
        # Nano's files as DELETED — the Sep 2026 wipeout hazard. The matting
        # run writes the exact files it produced, so we stage those.
        run: |
          if [ ! -s tmp/renders.txt ]; then
            echo "[images] no new renders this run"
            exit 0
          fi
          mapfile -t RENDERS < tmp/renders.txt
          git config user.email "bot@users.noreply.github.com"
          git config user.name "pc-parts-il-bot"
          bash scripts/git_commit_push.sh \
            "images: transparent TMS renders $(date -u +%F)" \
            "${RENDERS[@]}"
      - run: |
          git config user.email "bot@users.noreply.github.com"
          git config user.name "pc-parts-il-bot"
          bash scripts/git_commit_push.sh \
            "normalize: catalog for $(date -u +%F)" \
            data/catalog.json data/review_queue.json data/site