name: normalize-and-deploy
# Reads whatever's in data/raw/ (today's snapshots plus the stale-forward
# fallback in scraper/normalize_and_match.py for any vendor missing today)
# and writes data/catalog.json. No separate deploy step — Cloudflare Pages
# rebuilds automatically on the push this job makes.
#
# Trigger (Aug 2026 rework, see DECISIONS.md): previously a fixed
# `cron: 0 9 * * *`, then switched to `on: push: paths: data/raw/**` to
# react directly to new snapshots. That worked for the Nano (SSH deploy
# key push) but NOT for scrape-cloud.yml — GitHub Actions never fires
# on:push for commits pushed using the default GITHUB_TOKEN (built-in
# loop-prevention), so the cloud vendors' pushes were silently invisible
# to this trigger and normalize only ever ran for them via the 11:00 UTC
# fallback cron — an up-to-~8-hour dead gap. Fixed by adding a
# `workflow_run` trigger on scrape-cloud's completion — workflow_run fires
# regardless of which token pushed, so no PAT/secret is needed (keeps
# §9's zero-secrets rule intact for scrape-cloud.yml). It also naturally
# collapses scrape-cloud's 3 matrix-job pushes into one trigger
# (workflow_run fires once when the whole run finishes), which the
# concurrency block below was only approximating before.
#
# This revisits the plan's original "no push-triggered workflows, avoids
# recursion questions" stance (pc-parts-il-plan.md §8) — that concern
# doesn't apply here because the path filter is scoped to data/raw/**,
# which this job's own commit (catalog.json + review_queue.json, both
# directly under data/, never data/raw/) can never match. No self-trigger
# is possible.
#
# Build / publish split (Nov 2026, see decisions.md): `normalize` installs
# packages, downloads vendor images and runs the normalizer with a READ-ONLY
# token and no persisted git credentials, then hands its outputs over as an
# artifact (scripts/ci_bundle.sh). Only `publish` holds `contents: write`
# (explicit, since the repo default token may be read-only); it runs no
# third-party code, just applies the bundle, re-checks the publish set and
# pushes with scripts/git_commit_push.sh.
on:
  push:
    branches: [main]
    paths:
      - 'data/raw/**'
  workflow_run:
    # Fires when scrape-cloud.yml finishes, success or failure — one
    # vendor failing shouldn't block normalizing the others' fresh data
    # (or stale-forwarding the failed one). Only skip on 'cancelled'.
    workflows: ["scrape-cloud"]
    types: [completed]
    branches: [main]
  # No cron (Oct 2026): normalize runs only when a scrape finished. The old
  # 11:00 UTC safety net rebuilt the catalog with no new data, at a time
  # unrelated to any scrape. Use workflow_dispatch for a manual rebuild.
  workflow_dispatch: {}

concurrency:
  group: normalize-and-deploy
  cancel-in-progress: false

env:
  # Everything normalize_and_match.py writes: catalog.json, review_queue.json,
  # spec_gaps.json and the whole data/site tree (category files, history,
  # meta/index/qa/spec_report); data/images is this run's downloaded covers.
  PUBLISH_PATHS: data/catalog.json data/review_queue.json data/spec_gaps.json data/site data/images

jobs:
  # Skip when nothing under data/raw/ changed since the last normalize
  # commit (Oct 2026): a scrape-cloud run whose vendors were all skipped or
  # all failed still fires workflow_run, and rebuilding the same catalog
  # from the same snapshots is pure noise. Manual dispatch always runs.
  new-data-gate:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion != 'cancelled' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          fetch-depth: 50
          filter: blob:none
          sparse-checkout: .github
          persist-credentials: false
      - id: check
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          last="$(git log -1 --format=%H --grep='^normalize:' || true)"
          if [ -n "$last" ] && git diff --quiet "$last" HEAD -- data/raw; then
            echo "no data/raw change since normalize commit $last; skipping"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  normalize:
    permissions:
      contents: read
    needs: new-data-gate
    if: needs.new-data-gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      packed: ${{ steps.pack.outputs.packed }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt --break-system-packages
      - name: Spec schema <-> frontend drift check
        # scraper/specs/schema.py is the single source of truth for spec
        # field names/types/units. Fails when the generated TS
        # (site/src/specSchema.generated.ts) is stale or a hand-written
        # frontend spec key no longer exists in the schema.
        run: python scripts/check_spec_sync.py
      - name: Manufacturer data at the schema version
        # mfr/store.py ignores a data/mfr/*.json at another schema version, so
        # a bump without scripts/migrate_mfr_schema.py drops every maker fact.
        run: python scripts/migrate_mfr_schema.py --check
      - name: Refresh pcpartdb reference-spec index (spec system Tier 0)
        # Optional reference data, not core data — data/pcpartdb/ is
        # gitignored and rebuilt fresh here every run (~7MB from GitHub's
        # raw CDN, a few seconds) rather than committed. specs/resolvers/
        # reference.py degrades gracefully if this index is missing (Tier 0
        # disabled + a loud warning + the coverage report shows it), so a
        # transient failure here (e.g. GitHub's raw CDN having a bad moment)
        # must not block the daily catalog update — hence continue-on-error.
        run: python -m scraper.pcpartdb refresh
        continue-on-error: true
      - name: Backfill missing cover images (best-effort)
        # A cover the chooser flipped to a pruned file, or a product that only
        # ever had a listing thumbnail, would ship as an initials placeholder.
        # Refill the on-disk covers from the committed catalog before the
        # normalizer resolves them (it only serves a photo the file exists
        # for). Best-effort: missing photos must never block the catalog
        # update, and the fetch is capped + sequential to stay polite.
        run: python -m scraper.download_images --from-catalog --limit 500
        continue-on-error: true
      - run: python scraper/normalize_and_match.py
      - name: Backfill covers the NEW catalog selected (best-effort)
        # The backfill above reads the committed catalog, i.e. the PREVIOUS
        # run's product set and cover choices. This run's normalize can pick
        # different covers (2026-11-09: 107 products, 88 of them 1PC, had no
        # file on disk and check_site_images failed at 2.5% vs a 2% budget).
        # Fetch what the fresh catalog wants, then rebuild so the site JSON
        # references the files. Skipped when nothing is missing.
        id: backfill_new
        continue-on-error: true
        run: |
          out="$(python -m scraper.download_images --from-catalog --limit 500)"
          echo "$out"
          if echo "$out" | grep -qE 'downloaded [1-9]'; then
            echo "fetched=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Rebuild with the backfilled covers
        if: steps.backfill_new.outputs.fetched == 'true'
        run: python scraper/normalize_and_match.py
      - name: Golden-fixture resolver self-test (offline)
        # The gate resolves a fixture through its own product id first and its
        # anchors second; this pins that decision (a live product with a wrong
        # value must fail, a re-keyed one must not) against synthetic catalogs.
        run: python scripts/check_golden_resolution.py
      - name: Spec golden fixtures (see scraper/specs/README.md)
        # Hand-verified specs for known products must match the catalog the run
        # just wrote. Exit 2 = identity churn only (a fixture's product id moved
        # or vanished and nothing is wrong with the values): the catalog and site
        # still publish, the run shows a warning. Exit 1 = a spec value regressed,
        # the missing budget was exceeded or the population collapsed; blocks the
        # commit. --baseline is the previously committed catalog, so the
        # population guard needs no extra state.
        run: |
          if git show HEAD:data/catalog.json > "$RUNNER_TEMP/baseline-catalog.json" 2>/dev/null; then
            baseline="--baseline $RUNNER_TEMP/baseline-catalog.json"
          else
            baseline=""
          fi
          set +e
          python -m scraper.specs.golden.check_golden $baseline
          code=$?
          set -e
          if [ "$code" -eq 2 ]; then
            echo "::warning::golden fixtures: identity churn only - the catalog still publishes"
            exit 0
          fi
          exit "$code"
      - name: Vendor detail-page regressions (offline fixtures)
        # Scraped vendor markup + the label vocabulary it feeds. No network:
        # the fixtures live in scraper/specs/golden/tms_pages/. This is the
        # gate that would have caught the TMS selector that matched nothing
        # and silently shipped 2,254 products with an empty spec sheet.
        run: python scripts/check_tms_detail.py
      - name: Spec merge-layer regressions (offline, Sep 2026)
        # Pins the merge RULES the golden fixtures cannot: tier order, the
        # "model is a name, not a part number" rule (Ivory's דגם row shipped an
        # MPN as the model and flipped a product's identity key), validation
        # drops, and the value-equality helpers.
        run: python scripts/check_spec_merge.py
      - name: Category regressions (offline, Oct 2026)
        # Real titles that were misfiled: AIOs as case fans (the product
        # re-vote dropped the Hebrew liquid word), laptops / mini PCs / NAS
        # units as storage. A misfiled product can never fill its schema.
        # Also gates the catalog: one maker PN, one category; no "panel
        # only" / fan kit / screen module in the wrong category (Nov 2026).
        run: python scripts/check_categories.py
      - name: Identity-merge invariants (Nov 2026)
        # I1-I3 code/suffix separation, and I4: one vendor's two maker PNs
        # (or two EANs) in one product are two parts merged.
        run: python scripts/check_identity_merge.py
      - name: One maker per product, every product branded (Nov 2026)
        # A model code joins only inside one brand family (Antec F12 is not
        # Arctic F12); an empty brand is filled from the manufacturer spec.
        run: |
          python scripts/check_brands.py --self-test
          python scripts/check_brands.py
      - name: Repeated snapshot rows (Nov 2026)
        # A listing seen twice in one vendor-day (two crawls appended, or two
        # category pages) shows its NEWEST row's price and stock, in the
        # offer and in the price history; never the lowest or the first.
        run: |
          python scripts/check_snapshot_rows.py --self-test
          python scripts/check_snapshot_rows.py
      - name: Shipped text hygiene (Nov 2026)
        # No HTML entity (&#34; with or without the ;), bidi mark or NBSP in
        # any string of the catalog or data/site: they leaked into model
        # names and part numbers, and a marked SKU never matches.
        run: |
          python scripts/check_text_hygiene.py --self-test
          python scripts/check_text_hygiene.py
      - name: KSP listing-tag mapper (offline, Nov 2026)
        # KSP's Hebrew tags are its only structured spec source. Pins the
        # generation / warranty readers: an unparseable tag is no fact.
        run: python scripts/check_ksp_tags.py
      - name: Saved-page parser checks (offline, Oct 2026)
        # Real pages saved from the Nano (scraper/fixtures): the LDLC parser
        # must keep reading them, and joining on the right keys.
        run: python scripts/check_xref_fixtures.py
      - name: AI-extraction verifier (offline, Oct 2026)
        # The quote / re-parse checks that decide whether a model answer is
        # believed (scraper/extract/verify.py), plus the client's refusal and
        # cache handling against a fake API. No key, no network.
        run: python scripts/check_extract.py
      - name: Ledgers point at live data (Nov 2026)
        # A spec override no product reaches fails; stale manual products,
        # blocked pairs, QA dismissals, blocklist entries and unused covers
        # are reported against a budget (pruning is an owner call).
        run: |
          python scripts/check_ledgers.py --self-test
          python scripts/check_ledgers.py
      - name: Inference-rule backtest (offline, Oct 2026)
        # Shadow-runs every derive/title rule against the products where a
        # real source states the same field. Fails on a new rule below 99%
        # precision or a pinned one (scripts/backtest_baseline.json) that got
        # worse: a rule fills nulls, so a wrong one ships wrong values.
        run: python scripts/backtest_rules.py --check
      - name: Coverage gate self-test (offline)
        # Pins the gate's own arithmetic against synthetic catalogs: exact
        # counts (not percentages rounded to whole points), a floor is
        # inclusive, one product under trips. Run #322 failed on "95.0% below
        # floor 95%" because the rate was reconstructed from a rounded
        # percentage and landed on 94.99999999999999; this is the regression
        # test for that. No data files, no network.
        run: python scripts/check_spec_coverage.py --self-test
      - name: Spec coverage floors (offline, Oct 2026 coverage pass)
        # Anti-regression lock for the spec-coverage work: fail the job when
        # label-gap rows exceed the budget, a category's fill drops below its
        # floor, or a core compat field regresses. Floors come from the
        # post-fix baseline (see the script header); update them in the same
        # commit when the catalog genuinely changes shape, never silently.
        run: python scripts/check_spec_coverage.py
      - name: Spec invariants (audit 2026-11-10 F/G)
        # A value that breaks physics is wrong whatever printed it: threads
        # >= cores, a GPU memory type that exists, a board's socket = its
        # chipset's, every source label ranked by cross_check. Audit M: every
        # board chipset is a CHIPSET_INFO key, and every enum-refused vendor
        # value (spec_report schema_misses) is on SCHEMA_UNKNOWN_VALUES.
        run: |
          python scripts/check_spec_invariants.py --self-test
          python scripts/check_spec_invariants.py
      - name: Photo pipeline regressions (offline, Sep 2026)
        # Candidate derivation, scoring/picking, the refetch rule and
        # site-side resolution — all offline, no network, no real corpus.
        # This is the gate that would have caught the 228px-tile covers (a
        # download that skipped every existing file) and the v1 scoring bug
        # where 1PC's native URL shape read as a downgrade.
        run: python scripts/check_image_pick.py
      - name: Cover corpus (WebP only, size budget, no black-border covers)
        run: python scripts/check_image_files.py
      - name: Site image resolvability (no initials-placeholder flood)
        # Fails when more than 2% of built products resolve no local image —
        # the signature of a cover/JSON mismatch that would ship a site of
        # placeholder tiles even though the corpus itself is valid.
        run: python scripts/check_site_images.py
      - name: Site payload size guard (Phase 8, see DECISIONS.md)
        # Anti-regression lock for the data-trust + performance phases:
        # fail the job (no commit, no deploy) when a category/index file
        # exceeds 1MB or the category payload grows >15% without
        # proportional product growth. Pure stdlib, no deps.
        run: python scraper/check_site_size.py
      - name: Publish set coherence (one run, one product set)
        # catalog.json, data/site/*.json and data/site/spec_report.json are
        # written by this run but committed as separate files, and three
        # boxes push them (this job, the Nano, a local run). 2026-11-01: main
        # ended up with a 4,697-product catalog next to site files and a spec
        # report describing 4,678 — 19 products were in the catalog and in no
        # category file, so the site silently dropped them and site-checks
        # failed on the stale-report count. This compares the actual product
        # ids per category file, the index, meta.json's counts + generated_at
        # and the report, so a partial/mixed set can never be committed.
        run: |
          python scripts/check_publish_set.py --self-test
          python scripts/check_publish_set.py
      - name: Bundle the publish set for the publish job
        id: pack
        # REQUIRE_CLEAN_TREE=1: every file this run wrote must be in
        # PUBLISH_PATHS. A forgotten output is a bug, not noise — it used to
        # be autostashed on a rejected push and popped back as a merge
        # conflict (2026-11-01: data/spec_gaps.json), failing the whole run.
        run: |
          read -ra paths <<< "$PUBLISH_PATHS"
          REQUIRE_CLEAN_TREE=1 bash scripts/ci_bundle.sh pack "$RUNNER_TEMP/bundle" "${paths[@]}"
      - if: steps.pack.outputs.packed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: publish-normalize
          path: ${{ runner.temp }}/bundle
          retention-days: 1
          if-no-files-found: error

  publish:
    # The only job here that can push. No installs, no vendor content, no
    # normalizer: it applies the bundle onto the same commit, re-checks the
    # publish set (stdlib only) and pushes.
    permissions:
      contents: write
    needs: normalize
    if: needs.normalize.outputs.packed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: publish-normalize
          path: ${{ runner.temp }}/bundle
      - name: Apply the bundle
        run: |
          read -ra paths <<< "$PUBLISH_PATHS"
          bash scripts/ci_bundle.sh unpack "$RUNNER_TEMP/bundle" "${paths[@]}"
      - name: Publish set coherence (on what is about to be pushed)
        run: python scripts/check_publish_set.py
      - run: |
          git config user.email "bot@users.noreply.github.com"
          git config user.name "pc-parts-il-bot"
          read -ra paths <<< "$PUBLISH_PATHS"
          REQUIRE_CLEAN_TREE=1 bash scripts/git_commit_push.sh \
            "normalize: catalog for $(date -u +%F)" "${paths[@]}"
