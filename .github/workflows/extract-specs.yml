# Verified AI extraction (scraper/extract), manual only.
#
# Audit first: Claude is asked about fields a sourced tier already filled, and
# the per-field agreement lands in data/extract/trust.json. The store uses a
# field only after that audit measured it (10+ overlaps, <=3% disagreement).
# Then fill: only fields still empty on products below the 90% target. Every
# answer is cached by text hash, so a re-run pays only for changed listings.
# The next normalize run merges the result as tier 1.5 (`extracted`).
#
# Needs the ANTHROPIC_API_KEY repository secret. A full run of ~2,700
# products costs well under a dollar on Claude Haiku 5.5 (`--dry-run` prints
# the estimate). The key is handed only to the Audit and Fill steps.
#
# Build / publish split (Nov 2026, see decisions.md): `extract` runs with a
# read-only token and no persisted git credentials; `publish` alone can push
# and runs no third-party code (scripts/ci_bundle.sh hands the files over).
name: extract-specs

on:
  workflow_dispatch:
    inputs:
      audit:
        description: "products to audit before filling (0 = skip)"
        default: "300"
      limit:
        description: "at most N products to fill (empty = all)"
        default: ""

concurrency:
  group: extract-specs
  cancel-in-progress: false

env:
  PUBLISH_PATHS: data/extract/products.json data/extract/trust.json

jobs:
  extract:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 180
    outputs:
      packed: ${{ steps.pack.outputs.packed }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt --break-system-packages
      - run: python scripts/check_extract.py
      - name: Audit
        if: inputs.audit != '0'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AUDIT_COUNT: ${{ inputs.audit }}
        run: python -m scraper.extract --audit "$AUDIT_COUNT"
      - name: Fill
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FILL_LIMIT: ${{ inputs.limit }}
        run: |
          if [ -n "$FILL_LIMIT" ]; then
            python -m scraper.extract --limit "$FILL_LIMIT"
          else
            python -m scraper.extract
          fi
      - name: Bundle the results for publish
        id: pack
        run: |
          read -ra paths <<< "$PUBLISH_PATHS"
          files=()
          for f in "${paths[@]}"; do
            [ -f "$f" ] && files+=("$f")
          done
          [ "${#files[@]}" -eq 0 ] && { echo "nothing extracted"; exit 0; }
          bash scripts/ci_bundle.sh pack "$RUNNER_TEMP/bundle" "${files[@]}"
      - if: steps.pack.outputs.packed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: publish-extract
          path: ${{ runner.temp }}/bundle
          retention-days: 1
          if-no-files-found: error

  publish:
    permissions:
      contents: write
    needs: extract
    if: needs.extract.outputs.packed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: publish-extract
          path: ${{ runner.temp }}/bundle
      - run: |
          read -ra paths <<< "$PUBLISH_PATHS"
          bash scripts/ci_bundle.sh unpack "$RUNNER_TEMP/bundle" "${paths[@]}"
          files=()
          for f in "${paths[@]}"; do
            [ -f "$f" ] && files+=("$f")
          done
          git config user.email "bot@users.noreply.github.com"
          git config user.name "pc-parts-il-bot"
          bash scripts/git_commit_push.sh \
            "extract: verified spec facts for $(date -u +%F)" "${files[@]}"
