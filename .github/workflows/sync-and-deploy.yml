name: sync-and-deploy
on:
  schedule:
    - cron: '0 4 * * *'   # buffer after the Scrapy Cloud periodic job — GitHub cron is UTC only
  workflow_dispatch: {}
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt --break-system-packages
      - run: python scraper/sync_from_scrapy_cloud.py
        env:
          SHUB_APIKEY: ${{ secrets.SHUB_APIKEY }}
          SHUB_PROJECT_ID: ${{ secrets.SHUB_PROJECT_ID }}
      - run: python scraper/normalize_and_match.py
      - run: |
          git config user.email "bot@example.com"
          git config user.name "sync-bot"
          git add data/
          git diff --cached --quiet || git commit -m "sync $(date -u +%F)"
          git push
